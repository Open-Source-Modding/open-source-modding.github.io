; ============================================================
; bloomberg_settings.ini — patched for offline / no-server use
; ============================================================
; Internal Disrupt Editor (Watch Dogs: Legion) — Bloomberg crash/telemetry client.
; Default (embedded) config points at internal Ubisoft servers
; (msr-wd3-blo01.ubisoft.org:12090 etc.). With no connectivity the client
; retries and blocks editor loading. THIS FILE overrides the embedded
; defaults (loaded at initialization) — schema per Bloomberg 2.1.x template
; found in the Ubisoft leak (td_tools/metrix_beta/bloomberg_settings.ini).
;
; Search order (from BlackBox logs):
;   1. c:\bloomberg_settings.ini
;   2. <exe dir>\BlackBox\Release\bloomberg_settings.ini
;   3. C:\Users\Public\Documents\Ubisoft\Bloomberg\bloomberg_settings.ini
;   4. C:\Users\<user>\Documents\Ubisoft\Bloomberg\bloomberg_settings.ini
; Drop it at any of those — #2 sits next to the leaked editor.

[Game]
; Current application name. Used for display information only.
; Maps to GameSettings.ApplicationName
;ApplicationName=Disrupt Editor

; Compilation target used for the application.
; Maps to GameSettings.Target
Target=Release

; Context of the current application (ex: Tool, Editor).
; Maps to GameSettings.ApplicationContext
;ApplicationContext=Editor

; Suffix appended to the MD5 field to create separate issues for identical
; crashes. Maps to GameSettings.GroupingSuffix
GroupingSuffix=

[Bloomberg]
; Logging threshold: FATAL, ERROR, WARN, INFO, DEBUG, OFF.
; Maps to BloombergSettings.MinimalLoggingLevel
MinimalLoggingLevel=OFF

; Enable or disable stats. Maps to BloombergSettings.EnableStats
EnableStats=0

; Port on which the reporter tries to communicate with the client for
; retroaction. Maps to BloombergSettings.RetroactionPort
;RetroactionPort=12345

; Retroaction connection timeout (ms). Maps to BloombergSettings.RetroactionTimeoutMs
;RetroactionTimeoutMs=15000

[Connections]
; PATCH CORE: write reports to a local file instead of connecting to
; msr-wd3-blo01.ubisoft.org:12090. A File connection "supersedes connection 0"
; (the Server connection) — no network socket, no retry loop, nothing blocks.
; Accepted ConnectionType values (case insensitive): Reporter, Launcher,
; Proxy, Server, File. Lower index = higher priority. Max 10 via ini.
ConnectionType0=File
; Types of report for this connection: None, Exception, Assert, Warning,
; Custom, Flag, Stats, NoStats, Errors, All (| combos ok)
ConnectionReportType0=All
; Folder where report infos are written. Env vars supported/expanded (Windows).
ConnectionPath0=%TEMP%\Bloomberg\

[RuntimeVar]
; Fast-fail connection timeouts (ms) — belt and suspenders in case any
; non-File connection is still attempted (e.g. the editor's PostLaunch
; connection). 1..uint32_max.
ServerConnectionTimeoutMs=100
ReporterConnectionTimeoutMs=100

[Crash]
; Bitwise combination of None, Exception, Assert, Warning, Errors.
; Keep debugger-detection OFF so attaching VS/WinDbg doesn't trigger
; Bloomberg crash handling on non-fatal debugbreaks.
EnableDebuggerDetectionFor=None